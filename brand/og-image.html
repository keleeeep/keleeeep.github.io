<!doctype html>
<!-- Source for og-image.png. Render at 1200x630:
     chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=og-image.png brand/og-image.html -->
<html lang="en">
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    --bg: #0b0e12; --panel: #121820; --ink: #e6edf3; --muted: #8b98a5; --faint: #5c6873; --line: #1f2933; --accent: #57e3a0;
    width: 1200px; height: 630px; box-sizing: border-box; padding: 56px;
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .win { height: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 16px 22px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 20px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .bar span:last-child { margin-left: 14px; }
  .body { flex: 1; padding: 44px 52px; display: flex; flex-direction: column; }
  .comment { color: var(--faint); font-size: 24px; margin: 0 0 22px; }
  h1 { margin: 0; font-size: 60px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 700; }
  .hl { color: var(--accent); }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: 24px; color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: 12px; color: var(--accent); border: 1px solid rgba(87,227,160,.4); background: rgba(87,227,160,.08); padding: 8px 18px; border-radius: 999px; font-size: 22px; }
  .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
</style>
<div class="win">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>~/fredy-gunawan</span></div>
  <div class="body">
    <p class="comment">// backend engineer → tech lead · ex-ByteDance, Tokopedia</p>
    <h1>Hi, I'm Fredy.<br>I build <span class="hl">backends</span>,<br>and the teams around them.</h1>
    <div class="foot"><span>$ keleeeep.github.io</span><span class="status">open to lead &amp; manager roles</span></div>
  </div>
</div>
</html>
